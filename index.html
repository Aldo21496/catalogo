<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo Digital 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="turn.min.js"></script>
    <style>
      /* ══════════════════════════════
         VARIABLES & RESET
      ══════════════════════════════ */
      :root {
        --bg:        #0d0d0d;
        --surface:   #161616;
        --surface2:  #1f1f1f;
        --accent:    #c9a84c;
        --accent2:   #e91e63;
        --text:      #f0ece4;
        --text-dim:  rgba(240,236,228,0.45);
        --wsp:       #25d366;
        --radius:    14px;
        --panel-w:   420px;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        font-family: 'Lato', sans-serif;
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ══════════════════════════════
         HEADER
      ══════════════════════════════ */
      #top-bar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        background: var(--surface);
        border-bottom: 1px solid rgba(201,168,76,0.2);
        position: sticky;
        top: 0;
        z-index: 500;
      }

      #catalog-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.25em;
        color: var(--accent);
        letter-spacing: 1px;
      }

      /* ══════════════════════════════
         BOTÓN CARRITO
      ══════════════════════════════ */
      #cart-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #0d0d0d;
        border: none;
        border-radius: 30px;
        padding: 10px 18px;
        font-family: 'Lato', sans-serif;
        font-weight: 700;
        font-size: 0.95em;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 18px rgba(201,168,76,0.35);
      }
      #cart-btn:hover { background: #e0be6a; transform: scale(1.04); }

      #cart-count {
        background: #0d0d0d;
        color: var(--accent);
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 0.75em;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
      }
      #cart-count.bump { transform: scale(1.5); }

      /* ══════════════════════════════
         OVERLAY + PANEL CARRITO
      ══════════════════════════════ */
      #cart-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        z-index: 1100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        backdrop-filter: blur(3px);
      }
      #cart-overlay.open { opacity: 1; pointer-events: all; }

      #cart-panel {
        position: fixed;
        top: 0;
        right: calc(-1 * var(--panel-w) - 20px);
        width: var(--panel-w);
        max-width: 95vw;
        height: 100vh;
        background: var(--surface);
        z-index: 1200;
        display: flex;
        flex-direction: column;
        transition: right 0.38s cubic-bezier(0.4,0,0.2,1);
        box-shadow: -8px 0 40px rgba(0,0,0,0.6);
        border-left: 1px solid rgba(201,168,76,0.15);
      }
      #cart-panel.open { right: 0; }

      #cart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px;
        border-bottom: 1px solid rgba(201,168,76,0.15);
      }
      #cart-header h2 {
        font-family: 'Playfair Display', serif;
        font-size: 1.2em;
        color: var(--accent);
      }
      #cart-close {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 1.5em;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
      }
      #cart-close:hover { color: var(--text); }

      #cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-width: thin;
        scrollbar-color: var(--surface2) transparent;
      }

      #cart-empty {
        text-align: center;
        color: var(--text-dim);
        margin-top: 60px;
        font-size: 1em;
        line-height: 2.2;
      }
      #cart-empty span { font-size: 2.5em; display: block; margin-bottom: 8px; }

      /* ── Item del carrito ── */
      .cart-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--surface2);
        border-radius: var(--radius);
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,0.05);
        animation: slideIn 0.25s ease;
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(24px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .cart-item img {
        width: 58px;
        height: 58px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
        border: 1px solid rgba(255,255,255,0.08);
      }
      .cart-item-info { flex: 1; min-width: 0; }
      .cart-item-name {
        font-weight: 700;
        font-size: 0.88em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 3px;
      }
      .cart-item-price {
        font-size: 0.82em;
        color: var(--accent);
        font-weight: 700;
      }
      .cart-item-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 7px;
      }
      .qty-btn {
        background: rgba(255,255,255,0.1);
        border: none;
        color: var(--text);
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1em;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        line-height: 1;
      }
      .qty-btn:hover { background: var(--accent); color: #0d0d0d; }
      .qty-display { font-size: 0.9em; min-width: 20px; text-align: center; font-weight: 700; }

      .cart-item-remove {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 1.1em;
        cursor: pointer;
        padding: 6px;
        transition: color 0.2s;
        flex-shrink: 0;
        line-height: 1;
      }
      .cart-item-remove:hover { color: var(--accent2); }

      /* ── Footer carrito ── */
      #cart-footer {
        padding: 18px 22px;
        border-top: 1px solid rgba(201,168,76,0.15);
        background: var(--surface);
      }
      #cart-total-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
        font-size: 1em;
        color: var(--text-dim);
      }
      #cart-total-amount {
        font-family: 'Playfair Display', serif;
        font-size: 1.6em;
        color: var(--accent);
      }
      #btn-clear {
        width: 100%;
        background: none;
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text-dim);
        padding: 9px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 0.82em;
        font-family: 'Lato', sans-serif;
        transition: all 0.25s;
        margin-bottom: 10px;
      }
      #btn-clear:hover { border-color: var(--accent2); color: var(--accent2); }

      #btn-whatsapp {
        width: 100%;
        padding: 15px;
        background: var(--wsp);
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 1.05em;
        font-weight: 700;
        font-family: 'Lato', sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 22px rgba(37,211,102,0.35);
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #btn-whatsapp:hover { background: #1ebe5d; transform: scale(1.02); }
      #btn-whatsapp:disabled {
        background: var(--surface2);
        color: var(--text-dim);
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      /* ══════════════════════════════
         FLIPBOOK
      ══════════════════════════════ */
      #flipbook-wrapper {
        width: 100%;
        max-width: 1000px;
        margin: 24px auto 0;
        padding: 0 10px;
      }

      #flipbook { margin: 0 auto; background: transparent; }

      .page {
        position: relative;
        overflow: hidden;
        background: #111;
      }
      .page img {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .hard {
        background: linear-gradient(160deg, #111 0%, #1a1508 50%, #111 100%) !important;
        color: var(--text);
        text-align: center;
        font-family: 'Playfair Display', serif;
        font-size: 2em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
        border: 1px solid rgba(201,168,76,0.12);
      }
      .hard .accent-line {
        width: 48px;
        height: 2px;
        background: var(--accent);
        margin: 12px auto;
        border-radius: 2px;
      }
      .hard .subtitle {
        font-family: 'Lato', sans-serif;
        font-size: 0.38em;
        font-weight: 300;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--accent);
        margin-top: 4px;
      }

      /* Botón agregar al carrito en página */
      .buy-button {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 22px;
        background: var(--accent2);
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 0.9em;
        font-family: 'Lato', sans-serif;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 18px rgba(233,30,99,0.45);
        transition: all 0.3s;
        z-index: 10;
        white-space: nowrap;
        letter-spacing: 0.3px;
      }
      .buy-button:hover, .buy-button:active {
        background: #c2185b;
        transform: translateX(-50%) scale(1.06);
      }
      .buy-button.added {
        background: #2e7d32 !important;
        transform: translateX(-50%) scale(1.08) !important;
      }

      /* ── Navegación ── */
      #bottom-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin: 18px 0 30px;
        width: 100%;
      }

      #page-indicator {
        color: var(--text-dim);
        font-size: 0.82em;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      #swipe-hint {
        display: none;
        color: var(--text-dim);
        font-size: 0.78em;
      }

      #nav-buttons {
        display: flex;
        gap: 12px;
      }
      #nav-buttons button {
        padding: 11px 30px;
        font-size: 0.95em;
        font-family: 'Lato', sans-serif;
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s;
        letter-spacing: 0.5px;
      }
      #nav-buttons button:hover {
        background: var(--accent);
        color: #0d0d0d;
        border-color: var(--accent);
        font-weight: 700;
      }

      /* ══════════════════════════════
         RESPONSIVE
      ══════════════════════════════ */
      @media (max-width: 900px) {
        .hard { font-size: 1.6em; }
      }
      @media (max-width: 600px) {
        #catalog-title { font-size: 1.05em; }
        .hard { font-size: 1.2em; padding: 16px; }
        .buy-button { padding: 8px 16px; font-size: 0.8em; bottom: 10px; }
        #nav-buttons button { padding: 10px 20px; font-size: 0.88em; }
        #swipe-hint { display: block; }
        #cart-btn span:not(#cart-count) { display: none; }
        #cart-btn { padding: 10px 14px; }
      }
      @media (max-width: 360px) {
        .hard { font-size: 1em; }
        .buy-button { font-size: 0.75em; padding: 7px 12px; }
      }
    </style>
  </head>
  <body>

    <!-- ══ TOP BAR ══ -->
    <div id="top-bar">
      <div id="catalog-title">📖 Mi Catálogo 2026</div>
      <button id="cart-btn" onclick="toggleCart()">
        🛒 <span>Carrito</span>
        <span id="cart-count">0</span>
      </button>
    </div>

    <!-- ══ OVERLAY + PANEL CARRITO ══ -->
    <div id="cart-overlay" onclick="toggleCart()"></div>
    <div id="cart-panel">
      <div id="cart-header">
        <h2>🛒 Tu Pedido</h2>
        <button id="cart-close" onclick="toggleCart()">✕</button>
      </div>

      <div id="cart-items">
        <div id="cart-empty">
          <span>🛍️</span>
          Tu carrito está vacío<br/>
          <small style="font-size:0.85em;color:var(--text-dim)">Agregá productos desde el catálogo</small>
        </div>
      </div>

      <div id="cart-footer">
        <div id="cart-total-row">
          <span>Total del pedido</span>
          <span id="cart-total-amount">$0</span>
        </div>
        <button id="btn-clear" onclick="clearCart()">🗑️ Vaciar carrito</button>
        <button id="btn-whatsapp" onclick="sendWhatsApp()" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Enviar pedido por WhatsApp
        </button>
      </div>
    </div>

    <!-- ══ FLIPBOOK ══ -->
    <div id="flipbook-wrapper">
      <div id="flipbook">

        <!-- Portada -->
        <div class="hard">
          Mi Catálogo
          <div class="accent-line"></div>
          <span class="subtitle">Edición 2026</span>
        </div>
        <div class="hard"></div>

        <!-- ════════════════════════════
             PÁGINAS DE PRODUCTOS
             Total: 8 páginas + 4 hard = 12 (múltiplo de 4 ✅)

             Editá en cada botón:
               data-name  → nombre del producto
               data-price → precio SIN $ ni puntos (ej: 1299)
               data-img   → ruta de la imagen
             Y el texto visible del botón
        ════════════════════════════ -->

        <div class="page">
          <img src="pages/pagina1.jpg" alt="Página 1" />
          <button class="buy-button"
            data-name="Producto 1"
            data-price="1299"
            data-img="pages/pagina1.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $1.299
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina2.jpg" alt="Página 2" />
          <button class="buy-button"
            data-name="Producto 2"
            data-price="2500"
            data-img="pages/pagina2.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $2.500
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina3.jpg" alt="Página 3" />
          <button class="buy-button"
            data-name="Producto 3"
            data-price="890"
            data-img="pages/pagina3.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $890
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina4.jpg" alt="Página 4" />
          <button class="buy-button"
            data-name="Producto 4"
            data-price="3200"
            data-img="pages/pagina4.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $3.200
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina5.jpg" alt="Página 5" />
          <button class="buy-button"
            data-name="Producto 5"
            data-price="1500"
            data-img="pages/pagina5.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $1.500
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina6.jpg" alt="Página 6" />
          <button class="buy-button"
            data-name="Producto 6"
            data-price="4100"
            data-img="pages/pagina6.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $4.100
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina7.jpg" alt="Página 7" />
          <button class="buy-button"
            data-name="Producto 7"
            data-price="750"
            data-img="pages/pagina7.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $750
          </button>
        </div>

        <div class="page">
          <img src="pages/pagina8.jpg" alt="Página 8" />
          <button class="buy-button"
            data-name="Producto 8"
            data-price="2200"
            data-img="pages/pagina8.jpg"
            onclick="addToCart(this)">
            🛒 Agregar — $2.200
          </button>
        </div>

        <!-- Contraportada -->
        <div class="hard"></div>
        <div class="hard">
          ¡Gracias por visitar!
          <div class="accent-line"></div>
          <span class="subtitle">© 2026 — Todos los derechos reservados</span>
        </div>

      </div>
    </div>

    <!-- ══ BARRA INFERIOR ══ -->
    <div id="bottom-bar">
      <div id="page-indicator">Página 1</div>
      <div id="swipe-hint">👆 Deslizá o usá los botones para navegar</div>
      <div id="nav-buttons">
        <button id="btn-prev" onclick="prevPage()">◀ Anterior</button>
        <button id="btn-next" onclick="nextPage()">Siguiente ▶</button>
      </div>
    </div>

    <script>
      // ════════════════════════════════════
      //  ★ CONFIGURACIÓN — EDITÁ ESTO ★
      // ════════════════════════════════════
      const WHATSAPP_NUMBER = "549XXXXXXXXXX"; // Tu número con código de país, sin + ni espacios
      const STORE_NAME      = "Mi Catálogo 2026";

      // ════════════════════════════════════
      //  CARRITO
      // ════════════════════════════════════
      let cart = {};

      function toggleCart() {
        $("#cart-panel, #cart-overlay").toggleClass("open");
      }

      function addToCart(btn) {
        const name  = btn.dataset.name;
        const price = parseFloat(btn.dataset.price);
        const img   = btn.dataset.img;

        if (cart[name]) {
          cart[name].qty++;
        } else {
          cart[name] = { name, price, img, qty: 1 };
        }

        // Feedback visual en el botón
        const original = btn.innerHTML;
        btn.classList.add("added");
        btn.innerHTML = "✓ Agregado";
        setTimeout(() => {
          btn.classList.remove("added");
          btn.innerHTML = original;
        }, 1200);

        // Animación en el contador
        const $count = $("#cart-count");
        $count.addClass("bump");
        setTimeout(() => $count.removeClass("bump"), 300);

        renderCart();
      }

      function changeQty(name, delta) {
        if (!cart[name]) return;
        cart[name].qty += delta;
        if (cart[name].qty <= 0) delete cart[name];
        renderCart();
      }

      function removeItem(name) {
        delete cart[name];
        renderCart();
      }

      function clearCart() {
        if (Object.keys(cart).length === 0) return;
        if (confirm("¿Vaciar el carrito?")) {
          cart = {};
          renderCart();
        }
      }

      function renderCart() {
        const items = Object.values(cart);
        const $items = $("#cart-items");

        if (items.length === 0) {
          $items.html(`
            <div id="cart-empty">
              <span>🛍️</span>
              Tu carrito está vacío<br/>
              <small style="font-size:0.85em;color:var(--text-dim)">Agregá productos desde el catálogo</small>
            </div>`);
          $("#cart-total-amount").text("$0");
          $("#cart-count").text("0");
          $("#btn-whatsapp").prop("disabled", true);
          return;
        }

        let html  = "";
        let total = 0;
        let count = 0;

        items.forEach(item => {
          total += item.price * item.qty;
          count += item.qty;
          const sub  = (item.price * item.qty).toLocaleString("es-AR");
          const unit = item.price.toLocaleString("es-AR");
          // Escapar el nombre para uso en atributo onclick
          const safeName = item.name.replace(/'/g, "\\'");
          html += `
            <div class="cart-item">
              <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
              <div class="cart-item-info">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">$${unit} × ${item.qty} = $${sub}</div>
                <div class="cart-item-controls">
                  <button class="qty-btn" onclick="changeQty('${safeName}', -1)">−</button>
                  <span class="qty-display">${item.qty}</span>
                  <button class="qty-btn" onclick="changeQty('${safeName}', 1)">+</button>
                </div>
              </div>
              <button class="cart-item-remove" onclick="removeItem('${safeName}')" title="Quitar">✕</button>
            </div>`;
        });

        $items.html(html);
        $("#cart-total-amount").text("$" + total.toLocaleString("es-AR"));
        $("#cart-count").text(count);
        $("#btn-whatsapp").prop("disabled", false);
      }

      function sendWhatsApp() {
        const items = Object.values(cart);
        if (items.length === 0) return;

        let msg   = `¡Hola! Quiero hacer un pedido de *${STORE_NAME}*:\n\n`;
        let total = 0;

        items.forEach(item => {
          const sub = item.price * item.qty;
          total    += sub;
          msg      += `• ${item.name} x${item.qty} — $${sub.toLocaleString("es-AR")}\n`;
        });

        msg += `\n*Total: $${total.toLocaleString("es-AR")}*`;
        msg += `\n\n¿Podés confirmarme el pedido? 😊`;

        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
      }

      // ════════════════════════════════════
      //  FLIPBOOK
      // ════════════════════════════════════
      let flipbook          = null;
      let currentDisplayMode = null;

      function getLayout() {
        const winWidth  = $(window).width();
        const winHeight = $(window).height();
        let bookWidth, bookHeight, displayMode;

        if (winWidth > 900) {
          bookWidth   = Math.min(1000, winWidth * 0.88);
          bookHeight  = bookWidth * 0.7;
          displayMode = "double";
        } else if (winWidth > 600) {
          bookWidth   = winWidth * 0.92;
          bookHeight  = bookWidth * 0.8;
          displayMode = "double";
        } else {
          bookWidth   = winWidth * 0.96;
          bookHeight  = Math.min(bookWidth * 1.45, winHeight * 0.65);
          displayMode = "single";
        }

        return {
          bookWidth, bookHeight, displayMode,
          pageWidth: displayMode === "double" ? bookWidth / 2 : bookWidth
        };
      }

      function applyDimensions(l) {
        $("#flipbook").css({ width: l.bookWidth, height: l.bookHeight });
        $("#flipbook .page, #flipbook .hard").css({ width: l.pageWidth, height: l.bookHeight });
      }

      function reloadImages() {
        $("#flipbook .page img").each(function() {
          const src = $(this).attr("src");
          $(this).attr("src", "").attr("src", src);
        });
      }

      function updateIndicator() {
        if (!flipbook) return;
        const cur   = flipbook.turn("page");
        const total = flipbook.turn("pages");
        $("#page-indicator").text("Página " + cur + " de " + total);
        $("#btn-prev").css("opacity", cur <= 1    ? 0.35 : 1);
        $("#btn-next").css("opacity", cur >= total ? 0.35 : 1);
      }

      function prevPage() { if (flipbook) flipbook.turn("previous"); }
      function nextPage() { if (flipbook) flipbook.turn("next"); }

      function buildFlipbook(l) {
        if (flipbook) {
          try { flipbook.turn("destroy"); } catch(e) {}
          flipbook = null;
        }
        applyDimensions(l);
        flipbook = $("#flipbook").turn({
          width: l.bookWidth, height: l.bookHeight,
          elevation: 50, gradients: true,
          autoCenter: true, acceleration: true,
          display: l.displayMode,
          turnCorners: "bl,br,tl,tr",
          when: { turned: function() { updateIndicator(); } }
        });
        currentDisplayMode = l.displayMode;
        setTimeout(function() { reloadImages(); updateIndicator(); }, 150);
      }

      function onResize() {
        const l = getLayout();
        if (flipbook && l.displayMode === currentDisplayMode) {
          const cur = flipbook.turn("page");
          applyDimensions(l);
          try {
            flipbook.turn("size", l.bookWidth, l.bookHeight);
          } catch(e) { buildFlipbook(l); return; }
          try { flipbook.turn("page", cur); } catch(e) {}
          setTimeout(function() { reloadImages(); updateIndicator(); }, 100);
        } else {
          const cur = flipbook ? flipbook.turn("page") : 1;
          buildFlipbook(l);
          setTimeout(function() {
            try { flipbook.turn("page", cur); } catch(e) {}
          }, 200);
        }
      }

      // Touch swipe
      (function() {
        let startX = 0;
        document.addEventListener("DOMContentLoaded", function() {
          const el = document.getElementById("flipbook");
          el.addEventListener("touchstart", function(e) {
            startX = e.touches[0].clientX;
          }, { passive: true });
          el.addEventListener("touchend", function(e) {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
              if (diff > 0) nextPage(); else prevPage();
            }
          }, { passive: true });
        });
      })();

      // Teclado
      $(document).on("keydown", function(e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") nextPage();
        if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   prevPage();
      });

      // Init
      $(document).ready(function() { buildFlipbook(getLayout()); });

      let resizeTimer;
      $(window).on("resize orientationchange", function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(onResize, 300);
      });
    </script>
  </body>
</html>
